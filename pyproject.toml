[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-token-counter"
version = "1.0.0"
description = "Local usage proxy and context dashboard for OpenCode/LiteLLM"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "uvicorn>=0.34,<1", "python-dotenv>=1,<2", "psutil>=6,<8"]

[project.scripts]
token-counter = "token_counter.cli:main"

[tool.setuptools.package-data]
token_counter = ["static/*", "migrations/*.sql"]

[tool.setuptools.packages.find]
include = ["token_counter*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::ResourceWarning"]
